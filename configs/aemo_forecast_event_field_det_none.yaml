data:
  timezone: Australia/Brisbane
  delivery_column: delivery_start_aest
  available_column: available_at_aest
  region_column: region
  split_column: split
  history_columns:
    - rrp_aud_per_mwh
    - total_demand_mw
  target_column: rrp_aud_per_mwh
  price_transform: asinh
  quantile_target: price
  split_names:
    - train
    - validation
    - test
  split_boundaries:
    train:
      start: 2015-01-01 00:00:00
      end_exclusive: 2022-01-01 00:00:00
    validation:
      start: 2022-01-01 00:00:00
      end_exclusive: 2023-01-01 00:00:00
    test:
      start: 2023-01-01 00:00:00
      end_exclusive: 2025-01-01 00:00:00
  region_files:
    NSW1: ../electricity-price-forecasting-research/data/multi_market_energy_reserve/aemo_nem/nsw1_hourly.csv
    QLD1: ../electricity-price-forecasting-research/data/multi_market_energy_reserve/aemo_nem/qld1_hourly.csv
    TAS1: ../electricity-price-forecasting-research/data/multi_market_energy_reserve/aemo_nem/tas1_hourly.csv

forecast_protocol:
  input_hours: 72
  output_hours: 24
  stride_hours: 1
  calendar_features:
    - hour_sin
    - hour_cos
    - day_of_week_sin
    - day_of_week_cos
    - day_of_year_sin
    - day_of_year_cos
    - month_sin
    - month_cos
    - is_weekend
    - year_standardized

model:
  num_variables: 2
  num_frequencies: 16
  hidden_dim: 64
  num_layers: 3
  freq_cutoff: 10
  num_atoms: 16
  sigma_base: 0.05
  scale_warmup_ratio: 0.3
  fusion_mode: additive_trigonometric_gate
  residual_path: true
  future_exogenous_mode: dgf_linear
  # Per-quantile, per-horizon affine rescaling of the shared gate logit, so
  # tail quantiles can draw on the DGF event field more than the point does.
  quantile_gate: true
  # Detected DGF only: events found against the window median, no echo.
  dgf_type: detected
  # Future event field trained on the frozen detected-event trunk (stage A').
  event_field: true
  event_state_source: none
  event_detach_level: true
  event_recent_extremes: true
  event_echo: false
  echo_modulation: true
  quantiles:
    - 0.05
    - 0.10
    - 0.50
    - 0.90
    - 0.95

loss:
  point_weight: 1.0
  quantile_weight: 1.0
  decomposition_weight: 1.0
  smoothness_weight: 0.001
  sparsity_weight: 0.001
  target_sparsity: 0.3
  sparsity_excess_weight: 10.0
  event_nll_weight: 0.2
  event_anchor_weight: 0.1
  spike_threshold: 300.0
  trough_threshold: 0.0

training:
  batch_size: 128
  epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.0001
  seed: 2026
  device: cuda
  num_workers: 0
  device_batches: true
  torch_threads: 4
  output_directory: outputs/forecasting/event_field_det_none

origin_context:
  enabled: true
  name: dwgm_gas_price_7day_log
  path: data/aemo_exogenous/raw_gas/dwgm_prices.csv
  window_days: 7

future_exogenous:
  enabled: true
  name: max_spare_capacity_mw
  dimension: 1
  aggregation: min
  standardization: train_zscore
  vintage_rule: latest_available_pdpasa_with_stpasa_tail
  region_files:
    NSW1: data/aemo_exogenous/nsw1_pdpasa.npz
    QLD1: data/aemo_exogenous/qld1_pdpasa.npz
    TAS1: data/aemo_exogenous/tas1_pdpasa.npz

# PD PASA net load (DEMAND50 - UIGF) for the forecast day, read only by the
# CTF head.  Same point-in-time vintage rule as the DGF scarcity input.
ctf_exogenous:
  enabled: true
  features:
    - net_load_mw
  standardization: train_zscore
  # Beyond the central 99% of training values, compress standardized net load
  # with log1p instead of extrapolating linearly (unclipped) or holding it at
  # the bound (hard clip).
  clip_to_train_quantiles: [0.005, 0.995]
  out_of_range: log
  vintage_rule: latest_available_pdpasa_with_stpasa_tail
  region_files:
    NSW1: data/aemo_exogenous/nsw1_pdpasa.npz
    QLD1: data/aemo_exogenous/qld1_pdpasa.npz
    TAS1: data/aemo_exogenous/tas1_pdpasa.npz

# Scarcity shortfalls for the DGF quantile head only: max(q - spare, 0) for the
# training 1%, 5% and 10% quantiles of PD PASA maximum spare capacity.
quantile_exogenous:
  enabled: true
  features:
    - max_spare_capacity_mw
  shortfall_below_train_quantiles: [0.01, 0.05, 0.10]
  standardization: train_zscore
  vintage_rule: latest_available_pdpasa_with_stpasa_tail
  region_files:
    NSW1: data/aemo_exogenous/nsw1_pdpasa.npz
    QLD1: data/aemo_exogenous/qld1_pdpasa.npz
    TAS1: data/aemo_exogenous/tas1_pdpasa.npz

event_training:
  trunk_output_directory: outputs/forecasting/detected_dgf
  epochs: 40
  learning_rate: 0.001
