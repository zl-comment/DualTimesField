# Architecture design only. Not accepted by the experiment runner.
status: design_draft_not_implemented
runnable: false
model_kind: full_v2_tree_field
parent_protocol: aligned-baselines-20261012-static-v1
anchor:
  kind: frozen_lightgbm
  parent_run: outputs/forecasting/aligned_baselines_20261012
  match_region_and_seed: true
  quantiles: [0.05, 0.1, 0.5, 0.9, 0.95]
  sort_like_shared_scorer: true
conditioner:
  all_canonical_blocks: true
  anchor_quantiles_as_internal_features: true
  anchor_internal_normalization: outer_train_price_mean_std
  hidden_dim: 64
  attention_heads: 4
  history_cross_attention_layers: 1
  future_self_attention_layers: 1
  dropout: 0.1
event_field:
  kernel: asymmetric_gaussian
  kernels: 4
  center_range_hours: [0.0, 24.0]
  initial_centers_hours: [3.0, 9.0, 15.0, 21.0]
  width_range_hours: [0.25, 48.0]
  initial_left_width_hours: 2.0
  initial_right_width_hours: 4.0
  coefficients_per_kernel: 5
  coefficient_head_zero_init: true
  location_scale: outer_training_price_std
  log_gap_transform: 3_tanh_raw_over_3
  coefficient_activation_is_event_probability: false
transport:
  kind: median_shift_and_positive_gap_scaling
  implementation: anchor_plus_expm1_gap_increments
  composition_dtype: float64
  preserve_zero_gaps: true
  add_epsilon_to_gaps: false
  post_sort: false
crossfit:
  scheme: expanding_time_folds
  warmup_years: [2015, 2016, 2017]
  prediction_years: [2018, 2019, 2020, 2021]
  fold_preprocessing: fit_prefix_only
  inner_early_stopping: prefix_tail_only
  inner_preprocessing: fit_inner_train_only_then_refit_prefix
  inner_purge_by: inner_train_label_end_strictly_before_inner_selection_first_origin
  purge_by: actual_label_end_strictly_before_fold_first_origin
  join_by: [region, origin_unix, target_time_unix]
  include_all_fits_in_compute_budget: true
training:
  target: common_five_quantile_pinball
  loss_scale: outer_training_price_std
  group_coefficient_regularization: 0.0001
  epochs: 100
  patience: 15
  batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: AdamW
selection:
  split: selection_2022H1
  include_epoch_zero_anchor: true
  primary_metric: common_five_quantile_pinball
  proposed_max_overall_mae_ratio_to_anchor: 1.01
  proposed_max_0_to_300_mae_ratio_to_anchor: 1.01
  constraint_is_statistical_noninferiority_guarantee: false
  additional_calibrator: false
experiment:
  regions: [NSW1, QLD1, TAS1]
  seeds: [2026, 2027, 2028]
  region_dedicated_models: true
  execute_old_full_ablations_now: false
  test_status: retrospective_2023_2024
