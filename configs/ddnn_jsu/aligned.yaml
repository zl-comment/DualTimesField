# ddnn_jsu: 2026-10-22 扩展批神经基线（原生训练）
# Shared sections are item-for-item identical to configs/experiments/aemo_forecast_aligned_20261012.yaml;
# training matches the shared budget block except the model-specific learning_rate declared below.
data:
  timezone: Australia/Brisbane
  delivery_column: delivery_start_aest
  available_column: available_at_aest
  region_column: region
  split_column: split
  history_columns:
  - rrp_aud_per_mwh
  - total_demand_mw
  target_column: rrp_aud_per_mwh
  price_transform: identity
  quantile_target: transformed
  split_names:
  - train
  - selection
  - calibration
  - test
  split_boundaries:
    train:
      start: '2015-01-01'
      end_exclusive: '2022-01-01'
    selection:
      start: '2022-01-01'
      end_exclusive: '2022-07-01'
    calibration:
      start: '2022-07-01'
      end_exclusive: '2023-01-01'
    test:
      start: '2023-01-01'
      end_exclusive: '2025-01-01'
  region_files:
    NSW1: ../electricity-price-forecasting-research/data/multi_market_energy_reserve/aemo_nem/nsw1_hourly.csv
    QLD1: ../electricity-price-forecasting-research/data/multi_market_energy_reserve/aemo_nem/qld1_hourly.csv
    TAS1: ../electricity-price-forecasting-research/data/multi_market_energy_reserve/aemo_nem/tas1_hourly.csv
  relabel_splits: true
  load_end_exclusive: '2025-01-01'
forecast_protocol:
  input_hours: 72
  output_hours: 24
  stride_hours: 1
  calendar_features:
  - hour_sin
  - hour_cos
  - day_of_week_sin
  - day_of_week_cos
  - day_of_year_sin
  - day_of_year_cos
  - month_sin
  - month_cos
  - is_weekend
  - year_standardized
origin_context:
  enabled: true
  name: dwgm_gas_price_7day_log
  path: data/aemo_exogenous/raw_gas/dwgm_prices.csv
  window_days: 7
future_exogenous:
  enabled: true
  name: max_spare_capacity_mw
  dimension: 1
  aggregation: min
  standardization: train_zscore
  vintage_rule: latest_available_pdpasa_with_stpasa_tail
  region_files:
    NSW1: data/aemo_exogenous/nsw1_pdpasa.npz
    QLD1: data/aemo_exogenous/qld1_pdpasa.npz
    TAS1: data/aemo_exogenous/tas1_pdpasa.npz
ctf_exogenous:
  enabled: true
  features:
  - net_load_mw
  standardization: train_zscore
  clip_to_train_quantiles:
  - 0.005
  - 0.995
  out_of_range: log
  vintage_rule: latest_available_pdpasa_with_stpasa_tail
  region_files:
    NSW1: data/aemo_exogenous/nsw1_pdpasa.npz
    QLD1: data/aemo_exogenous/qld1_pdpasa.npz
    TAS1: data/aemo_exogenous/tas1_pdpasa.npz
quantile_exogenous:
  enabled: true
  features:
  - max_spare_capacity_mw
  shortfall_below_train_quantiles:
  - 0.01
  - 0.05
  - 0.1
  standardization: train_zscore
  vintage_rule: latest_available_pdpasa_with_stpasa_tail
  region_files:
    NSW1: data/aemo_exogenous/nsw1_pdpasa.npz
    QLD1: data/aemo_exogenous/qld1_pdpasa.npz
    TAS1: data/aemo_exogenous/tas1_pdpasa.npz
predispatch_exogenous:
  enabled: true
  features:
  - predispatch_rrp
  - predispatch_total_demand_mw
  - predispatch_available_generation_mw
  - predispatch_net_interchange_mw
  - predispatch_covered
  price_features:
  - predispatch_rrp
  standardization: train_zscore
  vintage_rule: latest_predispatch_run_published_by_origin
  region_files:
    NSW1: data/aemo_exogenous/nsw1_predispatch.npz
    QLD1: data/aemo_exogenous/qld1_predispatch.npz
    TAS1: data/aemo_exogenous/tas1_predispatch.npz
interconnector_exogenous:
  enabled: true
  features:
  - ic_net_import_mw
  - ic_import_room_mw
  - ic_export_room_mw
  - ic_main_import_room_mw
  - ic_covered
  standardization: train_zscore
  vintage_rule: latest_predispatch_run_published_by_origin
  region_files:
    NSW1: data/aemo_exogenous/nsw1_predispatch_interconnector.npz
    QLD1: data/aemo_exogenous/qld1_predispatch_interconnector.npz
    TAS1: data/aemo_exogenous/tas1_predispatch_interconnector.npz
aligned_protocol:
  id: aligned-baselines-20261012-static-v1
  stage: full_fixed_configuration_rerun
  model_boundary: shared_preprocessing_native_model_internals
  point_definition: sorted_q50
  score: raw_rrp_common_five_quantile_pinball_proxy
  training_budget_status: fixed_configuration_no_hpo_retrospective_test
model:
  quantiles:
  - 0.05
  - 0.1
  - 0.5
  - 0.9
  - 0.95
training:
  batch_size: 256
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  seed: 2026
  device: cuda
  num_workers: 0
  device_batches: true
  torch_threads: 2
  output_directory: outputs/forecasting/model_runs/ddnn_jsu
  checkpoint_metrics:
  - crps
  primary_selection: crps
  patience: 15
model_baselines:
  ddnn_jsu:
    hidden_dims:
    - 512
    - 512
    use_batch_norm: false
    dropout_rate: 0.0
    selection_metric: qs5
expansion:
  schema: aligned-expansion-20261022-v1
  batch: first_20261022
experiment:
  regions:
  - NSW1
  - QLD1
  - TAS1
  seeds:
  - 2026
  - 2027
  - 2028
  models:
  - ddnn_jsu
  max_origins: null
  cpu_threads_per_job: 4
  resources:
    gpu_ids:
    - 5
    - 6
    - 7
    cpu_workers: 1
    gpu_max_initial_used_mib: 4096
  neural:
    learning_rates:
      ddnn_jsu: 0.001
  baseline_parameters: {}
  interpretation:
    all_test_rows_retrospective: true
    hyperparameter_search_completed: false
    deterministic_replicates_not_independent_evidence: true
  execution_scope: single_model
